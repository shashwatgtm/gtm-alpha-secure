[build]
  # Only public pages and assets are published (scripts/build-site.mjs copies an allowlist into site/).
  command = "node scripts/build-site.mjs"
  publish = "site"

[dev]
  command = "node scripts/build-site.mjs"
  publish = "site"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# API Redirects
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment-success"
  to = "/.netlify/functions/payment-success"
  status = 200
  force = true

[[redirects]]
  from = "/api/check-config"
  to = "/.netlify/functions/check-config"
  status = 200
  force = true

# Catch-all API redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# MCP redirect
[[redirects]]
  force = true
  from = "/mcp-sse"
  status = 200
  to = "/.netlify/functions/mcp-sse"

[[redirects]]
  from = "/api-docs"
  to = "/api-docs.html"
  status = 200
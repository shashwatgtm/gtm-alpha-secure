[build]
  # Only public pages and assets are published (scripts/build-site.mjs copies an allowlist into site/).
  command = "node scripts/build-site.mjs"
  publish = "site"

[dev]
  command = "node scripts/build-site.mjs"
  publish = "site"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# The API and MCP functions set their own paths (config.path in netlify/functions/api.js and mcp-sse.js),
# so no redirect rules are needed for them. A forced redirect here would override those paths.
[[redirects]]
  from = "/api-docs"
  to = "/api-docs.html"
  status = 200
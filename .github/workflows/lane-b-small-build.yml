name: Lane B isolated Alpha build compatibility
on:
  push:
    branches: [codex/night-small-20261103]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Complete static build and Netlify function packaging
        run: node scripts/verify-small-build.mjs
      - name: Full repository regression suite
        run: node --test --test-concurrency=1 tests/*.test.mjs > .lane-b-build/tests.tap 2>&1
      - name: Record installed matcher dependency paths
        if: always()
        run: npm ls minimatch --all --json > .lane-b-build/minimatch-tree.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-small-build-evidence
          path: |
            .lane-b-build/compatibility.json
            .lane-b-build/build.log
            .lane-b-build/tests.tap
            .lane-b-build/minimatch-tree.json
          if-no-files-found: warn
          retention-days: 7
